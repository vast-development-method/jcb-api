name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (backfill)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing version tag on main history
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          bash scripts/release-plan.sh --tag "$REQUESTED_TAG" \
            --event "$EVENT_NAME" --workflow-ref "$WORKFLOW_REF" >> "$GITHUB_OUTPUT"

  build:
    name: Build release (${{ matrix.target }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install native musl compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Validate and build tagged source
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          test -f Cargo.lock
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          bash scripts/release-package.sh "$RELEASE_TARGET"
          bash scripts/ci-smoke.sh "dist/jcb-api-$RELEASE_TARGET"
          bash scripts/test-install.sh
          bash scripts/test-release-plan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/jcb-api-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate and verify release checksums
        run: |
          set -euo pipefail
          cd dist
          test -s jcb-api-x86_64-unknown-linux-musl
          test -s jcb-api-aarch64-unknown-linux-musl
          sha256sum jcb-api-aarch64-unknown-linux-musl jcb-api-x86_64-unknown-linux-musl > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish only after every artifact is verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$current_sha" == "$RELEASE_SHA" ]] || {
            echo 'Release tag moved after validation. Refusing to publish.' >&2
            exit 1
          }
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if existing_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$existing_draft" != true ]]; then
              echo 'This version is already published. Public assets are never overwritten.' >&2
              exit 1
            fi
            echo 'Resuming an unpublished draft release.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "JCB API $RELEASE_TAG" \
              --generate-notes "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            dist/jcb-api-x86_64-unknown-linux-musl \
            dist/jcb-api-aarch64-unknown-linux-musl \
            dist/SHA256SUMS
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort' | \
            jq -e '. == ["SHA256SUMS", "jcb-api-aarch64-unknown-linux-musl", "jcb-api-x86_64-unknown-linux-musl"]' > /dev/null
          release_id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.id')
          # Let GitHub select latest using stable semantic versions and dates;
          # publishing an older backfill must not promote it over a newer version.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy > /dev/null
