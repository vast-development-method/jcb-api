[package]
name = "jcb-api"
version = "0.1.0"
edition = "2021"
description = "Native network availability API and administration service for Joomla Component Builder"
repository = "https://github.com/vast-development-method/jcb-api"
license-file = "LICENSE"

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
fs2 = "0.4"
hex = "0.4"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "time", "io-util"] }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
